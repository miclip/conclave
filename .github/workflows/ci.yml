# Tests on every push and pull request.
#
# Only the offline suite runs. The live suites spawn real Claude Code and Codex sessions
# against real accounts, so they are env-gated and skip here — CI can prove the contract
# and the classifier, and cannot prove anything about the CLIs themselves. Treating a green
# run as evidence about live behaviour would be exactly the evidence-into-judgement
# collapse this project spends its effort avoiding.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every platform `release.yml` PACKAGES, so a platform-specific failure is found on a
        # branch rather than on a tag. v0.5.3 shipped with no binaries because `macos-15-intel`
        # was packaged but never tested: its slower runner blew a timing bound that ubuntu and
        # macos-arm64 both passed, the package job failed, and the gated release job never ran
        # (#169). Keep this list equal to that matrix.
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        node: ['24']
        include:
          # THE SUPPORTED FLOOR, tested rather than assumed (#317). `engines.node` is
          # `>=24.0.0`, but `node-version: '24'` resolves to the LATEST 24.x -- 24.20.0 on the
          # run that found this -- so the floor was exercised by nothing anyone ran. Four
          # `notify` tests failed on 24.0.2 and passed on 24.13 because Node emitted a type
          # stripping `ExperimentalWarning` on the older one and not the newer, and the tests
          # read stderr as output. A version-dependent break, invisible to a matrix that only
          # ever takes the newest.
          #
          # One platform, not three: what this covers is the RUNTIME's floor, which does not
          # vary by operating system, and three more full suites is a real cost for a second
          # reading of the same fact.
          - os: ubuntu-latest
            node: '24.0.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # A fresh checkout has no rendered hook registrations, and one test compares the
      # templates against what is installed. Rendering them first makes that test mean what
      # it says rather than depending on which test ran before it.
      - run: node bin/conclave.ts config install --no-diagnose
      - run: npm test

      # The step above writes this file whenever it gets as far as running the suite, pass
      # or fail; only a failure is worth keeping. It is deliberately not `always()`: a red
      # run that never reached the suite -- a typecheck failure, or `config install` above
      # it -- has no XML to upload, and this step warns and stays green rather than
      # reporting a second, misleading failure. CI's own logs already carry the same spec
      # output, so the artifact buys discoverability rather than rescue: a red run on a
      # branch nobody watched still has its assertion text attached when someone comes
      # back. Named per-OS because both matrix legs upload.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
