name: codeql

# Free on public repositories. Runs on the default branch, on pull requests into it, and
# weekly -- the schedule matters because an advisory published after a merge is the case a
# push-triggered scan never sees.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday, off the hour: a scheduled job on the hour queues behind everyone else's.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      # The scan's findings go to the security tab, which needs more than `contents: read`.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # SECURITY QUERIES ONLY, and the reason is the `pull_request` trigger above.
          #
          # That trigger publishes a check that FAILS on any alert this branch adds -- which is
          # not the same as reporting one. So the query suite decides what can block a merge,
          # and `security-and-quality` adds queries that have plenty to say about a codebase and
          # nothing to say about whether a merge is safe: of the 26 alerts on the first real
          # analysis, 12 were quality (10 of them `js/useless-assignment-to-local`). An unused
          # variable stopping a green PR is how a security gate becomes one people route around.
          #
          # `security-extended` keeps every security query -- the 7 `js/file-system-race`, the
          # `js/insecure-temporary-file`, the injection and sanitization rules are all still
          # reported and still gate -- and drops the style ones. There is no API to set a
          # failure threshold on a workflow-based setup, so the suite IS the threshold.
          queries: security-extended

      # No build step. This is a TypeScript project run through tsx rather than compiled, so
      # there is no artefact to produce and autobuild would have nothing to do.
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
